services:
  db:
    image: postgres:16-alpine
    container_name: ascari-db
    environment:
      POSTGRES_DB: ascari
      POSTGRES_USER: ascari
      POSTGRES_PASSWORD: ascari_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascari -d ascari"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    container_name: ascari-backend
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4002:4002"
    restart: unless-stopped

volumes:
  pgdata: