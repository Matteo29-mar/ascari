services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ascari
      POSTGRES_USER: ascari
      POSTGRES_PASSWORD: ascari_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascari -d ascari"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ascari_net

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    # usa backend/.env (quello tuo)
    env_file:
      - ./backend/.env
    expose:
      - "4002"
    networks:
      - ascari_net

  frontend:
    build:
      context: ./frontend
    # usa frontend/.env.production o frontend/.env (quello tuo)
    # NB: vale in build-time per Vite, quindi deve essere nel repo al build
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - ascari_net

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - ascari_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  ascari_net:
    driver: bridge