services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ascari
      POSTGRES_USER: ascari
      POSTGRES_PASSWORD: ascari_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascari -d ascari"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ascari_net

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4002"
    networks:
      - ascari_net

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - ascari_net

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ascari_net

volumes:
  pgdata:

networks:
  ascari_net:
    driver: bridge